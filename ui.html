<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>FLYVUE</title><style>body{font:16px system-ui;background:#0b0b0b;color:#eee;max-width:760px;margin:auto;padding:16px}button,label{display:flex;min-height:56px;padding:14px;margin:10px 0;border-radius:14px;align-items:center;justify-content:center;font-weight:700;background:#fff;color:#000;border:0;width:100%;box-sizing:border-box}button.sing{background:#ffcf4a}input{display:none}.skel{display:none;height:300px;border-radius:16px;background:linear-gradient(110deg,#111 30%,#222 45%,#111 60%);background-size:200%;animation:p 1.2s infinite}@keyframes p{to{background-position:-200%}}img{max-width:100%;border-radius:16px;touch-action:none}.chips{display:flex;gap:8px;overflow:auto}.chip{background:#222;padding:10px 12px;border-radius:999px;white-space:nowrap}.card{background:#151515;padding:12px;border-radius:16px;margin-top:12px}canvas{width:100%;height:240px;background:#000;border-radius:12px}.meta{font-size:13px;color:#aaa}audio{width:100%;margin-top:10px}.song{font-size:14px;line-height:1.6;white-space:pre-wrap}.title{font-size:28px;margin-bottom:4px}</style><main><h1>FLYVUE</h1><label>Choose image<input id="file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><button id="go">TEST WITH FLY BRAIN</button><button id="sing" class="sing">LET THE FLY SING</button><div id="skel" class="skel"></div><div id="result" hidden><div class="card"><img id="heat"></div><div id="chips" class="chips"></div><div class="card"><canvas id="scatter"></canvas></div><button id="download">Download card</button><p id="meta" class="meta"></p><div id="songcard" class="card" hidden><div id="songtitle" class="title"></div><div id="songmeta" class="meta"></div><audio id="audio" controls></audio><p id="lyrics" class="song"></p><p id="voiceerr" class="meta"></p></div></div></main><script>const $=x=>document.getElementById(x),f=$('file');let data,zoom=1,last=0;async function send(path){if(!f.files.length)return;$('skel').style.display='block';$('result').hidden=true;let q=new FormData;q.append('image',f.files[0],f.files[0].name);let req=fetch(path,{method:'POST',body:q}),wait=new Promise(r=>setTimeout(r,4000));let[r]=await Promise.all([req,wait]);data=await r.json();$('skel').style.display='none';if(!r.ok){alert(data.message||data.error||'Request failed');return}render()}$('go').onclick=()=>send('/test');$('sing').onclick=async()=>{await send('/sing?voice=1&variation='+Date.now())};function render(){if(!data.heatmap_png){renderSong();return}$('result').hidden=false;$('heat').src=data.heatmap_png;$('chips').innerHTML=['1ms','5ms','10ms'].map(t=>`<span class="chip">seen at ${t}: ${data.first_seen[t].count}</span>`).join('');$('meta').textContent=`${data.mode} · ${data.neuron_count.toLocaleString()} neurons · ${data.unique_hex_count} hex columns · ${data.sim_wall_clock_ms.toFixed(1)} ms · ${data.spikes_per_sec.toFixed(1)} spikes/s · Connectome © HHMI Janelia / FlyEM / Google Research, CC-BY`;draw();if(data.song)renderSong()}function renderSong(){let s=data.song;$('result').hidden=false;$('songcard').hidden=false;$('songtitle').textContent='FLY SONG #'+String(s.variation+1).padStart(3,'0');$('songmeta').textContent=`${s.mood} · ${s.tempo_bpm} BPM · ${s.key} ${s.scale} · neural seed ${s.neural_seed}`;$('lyrics').textContent=data.lyrics||s.lyrics.join('\n');if(data.audio_wav){$('audio').src=data.audio_wav;$('voiceerr').textContent='VoiceStudio vocal rendering ready.'}else{$('audio').removeAttribute('src');$('voiceerr').textContent=data.voice_error||'Voice rendering not available.'}}function draw(){let c=$('scatter'),x=c.getContext('2d'),d=data.soma_xy;c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);let w=c.clientWidth,h=c.clientHeight,hit=new Set(data.fired);x.fillStyle='#111';x.fillRect(0,0,w,h);d.forEach((p,i)=>{if(!Number.isFinite(p[0]))return;x.globalAlpha=hit.has(i)?.9:.08;x.fillStyle=hit.has(i)?'#ffcc66':'#aaa';x.fillRect(p[0]*w,p[1]*h,1.5,1.5)})}$('heat').addEventListener('touchstart',e=>{if(e.touches.length===2)last=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});$('heat').addEventListener('touchmove',e=>{if(e.touches.length===2){let n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=Math.max(1,Math.min(4,zoom*n/last));$('heat').style.transform=`scale(${zoom})`;last=n}},{passive:true});$('download').onclick=()=>{let c=document.createElement('canvas');c.width=1080;c.height=1350;let x=c.getContext('2d'),im=new Image;im.onload=()=>{x.fillStyle='#0b0b0b';x.fillRect(0,0,1080,1350);x.drawImage(im,40,120,1000,900);x.fillStyle='#fff';x.font='bold 44px system-ui';x.fillText('FLYVUE',40,70);x.font='28px system-ui';x.fillText('tested on a real brain · flyvue.link',40,108);x.font='22px system-ui';x.fillText(`${data.neuron_count.toLocaleString()} neurons · ${data.unique_hex_count} hex columns`,40,1060);x.fillText('Connectome © HHMI Janelia / FlyEM / Google Research, CC-BY',40,1110);let a=document.createElement('a');a.download='flyvue-card.png';a.href=c.toDataURL('image/png');a.click()};im.src=data.heatmap_png}</script>

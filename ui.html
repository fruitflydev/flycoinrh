<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLYVUE</title><style>body{font:16px system-ui;background:#0b0b0b;color:#eee;max-width:760px;margin:auto;padding:16px}button,label{display:flex;min-height:56px;padding:14px;margin:10px 0;border-radius:14px;align-items:center;justify-content:center;font-weight:700}input{display:none}.skel{display:none;height:300px;background:#222;animation:p 1.2s infinite}@keyframes p{50%{opacity:.45}}img{max-width:100%;border-radius:16px}</style><h1>FLYVUE</h1><label>Choose image<input id="file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><button id="go">TEST WITH FLY BRAIN</button><div id="skel" class="skel"></div><img id="heat"><pre id="meta"></pre><script>const f=document.getElementById('file'),g=document.getElementById('go');g.onclick=async()=>{let s=document.getElementById('skel');s.style.display='block';let q=new FormData;q.append('image',f.files[0]);let r=await fetch('/test',{method:'POST',body:q});let d=await r.json();s.style.display='none';document.getElementById('heat').src=d.heatmap_png;document.getElementById('meta').textContent=JSON.stringify(d,null,2)}</script>

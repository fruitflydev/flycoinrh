<style>
/* One look in every theme: the room paints its own colours inside the canvas. */
:root{
  --sub-bg:rgba(12,10,5,.66);
  --sub-ink:#f4eed9;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:#4e4628;color:var(--sub-ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.stage{position:fixed;inset:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}

#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{
  position:absolute;left:0;top:0;transform:translate(-50%,-100%);will-change:transform;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;white-space:nowrap;
  color:var(--sub-ink);background:rgba(12,10,5,.8);padding:1px 7px;border-radius:2px;
  border-bottom:2px solid var(--acc);
}

/* subtitles: the line being typed, the last three faintly above it */
.subs{
  position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(880px,calc(100% - 32px));background:var(--sub-bg);border-radius:4px;
  padding:10px 16px 12px;
}
.who{font-family:var(--mono);font-weight:500;letter-spacing:.08em;color:var(--acc);margin-right:.6em}

.caret{display:inline-block;width:.5em;height:1em;vertical-align:-.12em;margin-left:2px;background:currentColor;opacity:.55}

/* fly accents: labels only, no meaning attached */
.f0{--acc:#7deaff} .f1{--acc:#f0bc5f} .f2{--acc:#6fdca6} .f3{--acc:#c9b3ff}

<script type="module">
import * as THREE from 'three';

// Where the conversation comes from.
const RELAY_BASE = 'https://backrooms-production-004b.up.railway.app';

/* ------------------------------------------------------------------------
   Relay shapes used here (tolerant):
     GET  /status            {running:bool, ...}
     GET  /turns             {turns:[...newest 100, oldest first], last_seq, oldest_seq}
     GET  /turns?after=ID    {turns:[...first 100 with seq > ID], ...}
     GET  /stream?after=ID   SSE: `turn` events replaying seq > ID (or Last-Event-ID), one
                             `caught_up` event {last_seq}, then live `turn` events
   turn: {seq, at, ts, speaker, text, fly_index?, ...}; only speaker, text, seq/ts and
   fly_index are read, and every string is shown with textContent.
   ------------------------------------------------------------------------ */

const $ = (id) => document.getElementById(id);
const LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const QS = new URLSearchParams(location.search);
// a relay override is only honoured on a local development host
const RELAY = String((LOCAL && QS.get('relay')) || RELAY_BASE).replace(/\/+$/, '');

const mqReduce = window.matchMedia('(prefers-reduced-motion: reduce)');
let REDUCED = mqReduce.matches;
if (mqReduce.addEventListener) mqReduce.addEventListener('change', (e) => { REDUCED = e.matches; });

const MAX_TEXT = 1200;          // client-side sanity cap: longer lines are dropped, never cut
const RECENT = 3;               // earlier lines shown faintly above the current one
const FLY_COUNT = 4;
const TAU = Math.PI * 2;

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const damp = (x, target, rate, dt) => x + (target - x) * (1 - Math.exp(-rate * dt));
const wrapAngle = (a) => ((((a + Math.PI) % TAU) + TAU) % TAU) - Math.PI;
const dampAngle = (x, target, rate, dt) => x + wrapAngle(target - x) * (1 - Math.exp(-rate * dt));

/* ========================================================================
   3D ROOM
   ======================================================================== */
const stage = $('stage');
const canvas = $('scene');
let R = null;   // everything the renderer owns

function canvasTex(w, h, draw, repeat = [1, 1], srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function blob(g, w, h, x, y, rad, color) {
  // radial blob drawn with wrap-around so the tile stays seamless
  for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {
    const cx = x + ox, cy = y + oy;
    if (cx + rad < 0 || cx - rad > w || cy + rad < 0 || cy - rad > h) continue;
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
    gr.addColorStop(0, color);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }
}
function grain(g, w, h, amt, r, blueK = 0.8) {
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - 0.5) * amt;
    d[i] += n; d[i + 1] += n; d[i + 2] += n * blueK;
  }
  g.putImageData(im, 0, 0);
}

function buildRoom(scene, anisotropy) {
  const CELL = 4, N = 15, H = 2.72, W = CELL * N;

  // wallpaper: one mono yellow, a thin double stripe and a faint diamond motif
  const wallTex = canvasTex(512, 512, (g, w, h) => {
    const r = rng(11);
    g.fillStyle = '#c6b058'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++) {
      const light = r() < 0.5;
      blob(g, w, h, r() * w, r() * h, 30 + r() * 90,
        light ? `rgba(255,244,190,${0.04 + r() * 0.05})` : `rgba(120,98,36,${0.04 + r() * 0.06})`);
    }
    for (let x = 0; x < w; x += 128) {
      g.fillStyle = 'rgba(112,90,32,.22)'; g.fillRect(x, 0, 4, h);
      g.fillStyle = 'rgba(255,242,186,.12)'; g.fillRect(x + 5, 0, 3, h);
      g.fillStyle = 'rgba(112,90,32,.14)'; g.fillRect(x + 10, 0, 2, h);
    }
    g.lineWidth = 2.2;
    for (let col = 0; col < 4; col++) {
      const cx = 64 + col * 128;
      for (let row = -1; row <= 8; row++) {
        const cy = row * 64 + (col % 2 ? 32 : 0) + 32;
        g.strokeStyle = 'rgba(108,86,30,.25)';
        g.beginPath(); g.moveTo(cx, cy - 13); g.lineTo(cx + 8, cy); g.lineTo(cx, cy + 13); g.lineTo(cx - 8, cy); g.closePath(); g.stroke();
        g.beginPath(); g.moveTo(cx, cy - 22); g.lineTo(cx, cy - 16); g.moveTo(cx, cy + 16); g.lineTo(cx, cy + 22); g.stroke();
        g.fillStyle = 'rgba(108,86,30,.22)'; g.beginPath(); g.arc(cx, cy, 2, 0, TAU); g.fill();
      }
    }
    for (let i = 0; i < 14; i++) {   // faint vertical grime
      const x = r() * w, a = 0.015 + r() * 0.03;
      const gr = g.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, 'rgba(90,70,20,0)'); gr.addColorStop(0.5 + r() * 0.4, `rgba(90,70,20,${a})`); gr.addColorStop(1, 'rgba(90,70,20,0)');
      g.fillStyle = gr; g.fillRect(x, 0, 6 + r() * 18, h);
    }
    grain(g, w, h, 16, r);
  }, [4.2 / 0.8, H / 0.8]);
  wallTex.anisotropy = anisotropy;

  const carpetTex = canvasTex(512, 512, (g, w, h) => {
    const r = rng(23);
    g.fillStyle = '#9b8962'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      const dark = r() < 0.5;
      blob(g, w, h, r() * w, r() * h, 4 + r() * 26,
        dark ? `rgba(70,56,30,${0.05 + r() * 0.08})` : `rgba(180,160,112,${0.05 + r() * 0.07})`);
    }
    const im = g.getImageData(0, 0, w, h), d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * 36, s = r() < 0.05 ? -26 : 0;
      d[i] += n + s; d[i + 1] += n + s; d[i + 2] += n * 0.7 + s;
    }
    g.putImageData(im, 0, 0);
  }, [W / 1.6, W / 1.6]);
  carpetTex.anisotropy = anisotropy;

  // large-scale damp patches, used as an ambient-occlusion map at a coarser repeat
  const dampTex = canvasTex(256, 256, (g, w, h) => {
    const r = rng(31);
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 16; i++) blob(g, w, h, r() * w, r() * h, 20 + r() * 60, `rgba(40,40,40,${0.25 + r() * 0.35})`);
  }, [W / 11, W / 11], false);

  const ceilTex = canvasTex(256, 256, (g, w, h) => {
    const r = rng(5);
    g.fillStyle = '#d4ccab'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) {
      g.fillStyle = `rgba(92,82,52,${0.1 + r() * 0.22})`;
      g.fillRect(r() * w, r() * h, 1 + r() * 1.5, 1 + r() * 1.5);
    }
    blob(g, w, h, r() * w, r() * h, 70, 'rgba(150,120,60,.06)');
    g.fillStyle = '#8c8468'; g.fillRect(0, 0, w, 5); g.fillRect(0, 0, 5, h);
    g.fillStyle = 'rgba(255,255,236,.22)'; g.fillRect(0, 5, w, 2); g.fillRect(5, 0, 2, h);
  }, [W / 0.62, W / 0.62]);
  ceilTex.anisotropy = anisotropy;

  const panelTex = canvasTex(64, 128, (g, w, h) => {
    g.fillStyle = '#fffcec'; g.fillRect(0, 0, w, h);
    const gr = g.createLinearGradient(0, 0, w, 0);
    gr.addColorStop(0, 'rgba(206,196,150,.7)'); gr.addColorStop(0.18, 'rgba(255,255,255,0)');
    gr.addColorStop(0.82, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(206,196,150,.7)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(196,186,146,.35)'; g.lineWidth = 1;
    for (let y = 3; y < h; y += 6) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); g.stroke(); }
    for (let x = 3; x < w; x += 6) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); g.stroke(); }
    g.strokeStyle = '#8f876a'; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4);
  });
  panelTex.wrapS = panelTex.wrapT = THREE.ClampToEdgeWrapping;

  // --- materials ---
  const wallMat = new THREE.MeshLambertMaterial({ map: wallTex });
  wallMat.onBeforeCompile = (sh) => {
    // darker toward the carpet, brighter toward the lights
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying float vWorldY;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 brWp = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          brWp = instanceMatrix * brWp;
        #endif
        vWorldY = (modelMatrix * brWp).y;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vWorldY;')
      .replace('#include <map_fragment>', '#include <map_fragment>\n diffuseColor.rgb *= mix(0.6, 1.08, smoothstep(0.0, 2.7, vWorldY));');
  };
  const baseMat = new THREE.MeshLambertMaterial({ color: 0x6f6038 });
  const floorMat = new THREE.MeshLambertMaterial({ map: carpetTex, aoMap: dampTex, aoMapIntensity: 0.9 });
  const ceilMat = new THREE.MeshLambertMaterial({ map: ceilTex, emissive: 0x3b3624 });
  const panelMat = new THREE.MeshBasicMaterial({ map: panelTex, color: 0xffffff });

  // --- floor + ceiling ---
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, W).rotateX(-Math.PI / 2), floorMat);
  scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, W).rotateX(Math.PI / 2), ceilMat);
  ceil.position.y = H;
  scene.add(ceil);

  // --- walls on a grid: a 3x3 open room, four straight corridors, random walls beyond ---
  const r = rng(77);
  const half = (N - 1) / 2;
  const inRoom = (i, j) => Math.abs(i) <= 1 && Math.abs(j) <= 1;
  const walls = [];
  for (let i = -half; i <= half; i++) {
    for (let j = -half; j < half; j++) {
      // wall lying along X between cell (i,j) and (i,j+1)
      const a = inRoom(i, j), b = inRoom(i, j + 1);
      let put;
      if (a && b) put = false;
      else if (a !== b) put = i !== 0;                       // room boundary, doorway on the z corridor
      else if (i === 0) put = false;                         // z corridor stays open along its length
      else if (Math.abs(i) === 0 || (j === 0 || j === -1) && Math.abs(i) > 1) put = r() < 0.82; // x corridor sides
      else put = r() < 0.42;
      if (put) walls.push([i * CELL, (j + 0.5) * CELL, 0]);
    }
  }
  for (let j = -half; j <= half; j++) {
    for (let i = -half; i < half; i++) {
      // wall lying along Z between cell (i,j) and (i+1,j)
      const a = inRoom(i, j), b = inRoom(i + 1, j);
      let put;
      if (a && b) put = false;
      else if (a !== b) put = j !== 0;
      else if (j === 0) put = false;
      else if ((i === 0 || i === -1) && Math.abs(j) > 1) put = r() < 0.82;
      else put = r() < 0.42;
      if (put) walls.push([(i + 0.5) * CELL, j * CELL, Math.PI / 2]);
    }
  }
  const wallGeo = new THREE.BoxGeometry(CELL + 0.2, H, 0.2);
  const baseGeo = new THREE.BoxGeometry(CELL + 0.24, 0.1, 0.24);
  const wallIM = new THREE.InstancedMesh(wallGeo, wallMat, walls.length);
  const baseIM = new THREE.InstancedMesh(baseGeo, baseMat, walls.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s1 = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3(), yAxis = new THREE.Vector3(0, 1, 0);
  walls.forEach(([x, z, ry], k) => {
    q.setFromAxisAngle(yAxis, ry);
    m.compose(p.set(x, H / 2, z), q, s1); wallIM.setMatrixAt(k, m);
    m.compose(p.set(x, 0.05, z), q, s1); baseIM.setMatrixAt(k, m);
  });
  scene.add(wallIM, baseIM);

  // --- fluorescent panels, one per cell ---
  const panels = [];
  for (let i = -half; i <= half; i++) for (let j = -half; j <= half; j++) panels.push([i * CELL, j * CELL]);
  const panelIM = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.62, 1.24).rotateX(Math.PI / 2), panelMat, panels.length);
  const white = new THREE.Color(1, 1, 1);
  panels.forEach(([x, z], k) => {
    m.compose(p.set(x, H - 0.012, z), q.identity(), s1);
    panelIM.setMatrixAt(k, m);
    panelIM.setColorAt(k, white);
  });
  scene.add(panelIM);
  const panelIndex = (x, z) => panels.findIndex(([px, pz]) => px === x && pz === z);

  // --- light: warm hemisphere plus three panel lights that follow their panel's flicker ---
  const hemi = new THREE.HemisphereLight(0xfff0bf, 0x6a5a33, 2.3);
  scene.add(hemi);
  const roomLights = [[0, 0], [-4, 0], [4, 0]].map(([x, z]) => {
    const L = new THREE.PointLight(0xfff4d2, 7, 0, 1.6);
    L.position.set(x, H - 0.2, z);
    scene.add(L);
    return { light: L, base: 7, panel: panelIndex(x, z) };
  });

  return { H, CELL, panels, panelIM, roomLights, hemi };
}

/* ---------------- the flies ---------------- */
const ACCENTS = [0x7deaff, 0xf0bc5f, 0x6fdca6, 0xc9b3ff];
const BODY_H = 0.118;

function makeWingMaterial(fan) {
  return new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
      uOpacity: { value: fan ? 0 : 1 },
      uFan: { value: fan ? 1 : 0 },
      uTint: { value: new THREE.Color(0.55, 0.52, 0.45) },
    }]),
    vertexShader: `
      varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      #include <fog_pars_vertex>
      void main(){
        vUv = uv;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vN = normalize(normalMatrix * normal);
        vV = normalize(-mvPosition.xyz);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      uniform float uOpacity; uniform float uFan; uniform vec3 uTint;
      varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      #include <fog_pars_fragment>
      vec3 hue(float h){ return clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }
      void main(){
        float ndv = abs(dot(normalize(vN), normalize(vV)));
        float fres = pow(1.0 - ndv, 2.0);
        vec2 p = uFan > 0.5 ? (vUv * 2.0 - 1.0) * 0.26 : vUv;
        float len = length(p);
        float ang = atan(p.y, p.x);
        vec3 irid = hue(ndv * 1.3 + len * 3.2 + 0.05);
        vec3 col = mix(uTint, irid, (0.32 + 0.45 * fres) * (uFan > 0.5 ? 0.6 : 1.0));
        float vein = 0.0;
        if (uFan < 0.5) {
          for (int k = 0; k < 4; k++) {
            float a = -0.14 + 0.085 * float(k);
            vein = max(vein, 1.0 - smoothstep(0.0011, 0.003, abs(ang - a) * len));
          }
          vein = max(vein, 1.0 - smoothstep(0.0015, 0.004, abs(len - 0.13)) * step(abs(ang + 0.03), 0.06));
        }
        col = mix(col, vec3(0.16, 0.12, 0.07), vein * 0.75);
        float alpha = uOpacity * (0.2 + 0.45 * fres + vein * 0.45);
        if (uFan > 0.5) alpha = uOpacity * (0.16 + 0.22 * fres) * smoothstep(0.02, 0.1, len) * (1.0 - smoothstep(0.2, 0.26, len));
        gl_FragColor = vec4(col, alpha);
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: true,
  });
}

function buildFlies(scene) {
  const G = {
    sphere: new THREE.SphereGeometry(1, 22, 14),
    abdomen: new THREE.SphereGeometry(1, 26, 18).rotateX(Math.PI / 2),
    eye: new THREE.IcosahedronGeometry(1, 2),
    cyl: new THREE.CylinderGeometry(0.72, 1, 1, 7, 1),
    joint: new THREE.SphereGeometry(1, 8, 6),
    cone: new THREE.ConeGeometry(1, 1, 7),
  };
  const bandTex = canvasTex(64, 256, (g, w, h) => {
    const r = rng(9);
    g.fillStyle = '#c9a26a'; g.fillRect(0, 0, w, h);
    const bands = [[0.34, 0.41], [0.47, 0.56], [0.61, 0.71], [0.76, 0.86], [0.9, 1.0]];
    for (const [a, b] of bands) {
      const gr = g.createLinearGradient(0, a * h, 0, b * h);
      gr.addColorStop(0, 'rgba(46,30,16,0)'); gr.addColorStop(0.3, 'rgba(46,30,16,.92)'); gr.addColorStop(1, 'rgba(46,30,16,.96)');
      g.fillStyle = gr; g.fillRect(0, a * h, w, (b - a) * h);
    }
    grain(g, w, h, 20, r);
  });
  bandTex.wrapT = THREE.ClampToEdgeWrapping;
  const bristleTex = canvasTex(128, 128, (g, w, h) => {
    const r = rng(3);
    g.fillStyle = '#8d6c44'; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(60,42,24,.5)'; g.fillRect(w * 0.44, 0, w * 0.12, h);
    for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(40,28,14,${0.2 + r() * 0.4})`; g.fillRect(r() * w, r() * h, 1.2, 2.5); }
  });

  const mats = {
    thorax: new THREE.MeshStandardMaterial({ map: bristleTex, roughness: 0.62, metalness: 0.05 }),
    head: new THREE.MeshStandardMaterial({ color: 0x9a7448, roughness: 0.6 }),
    eye: new THREE.MeshStandardMaterial({ color: 0xb0141c, emissive: 0x2c0204, roughness: 0.32, metalness: 0.1, flatShading: true }),
    abdomen: new THREE.MeshStandardMaterial({ map: bandTex, roughness: 0.5, metalness: 0.05 }),
    dark: new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.7 }),
    leg: new THREE.MeshStandardMaterial({ color: 0x5c4630, roughness: 0.66 }),
  };
  const wingShape = new THREE.Shape();
  wingShape.moveTo(0, 0);
  wingShape.bezierCurveTo(0.03, 0.022, 0.1, 0.05, 0.2, 0.038);
  wingShape.bezierCurveTo(0.255, 0.03, 0.27, -0.012, 0.235, -0.032);
  wingShape.bezierCurveTo(0.16, -0.052, 0.055, -0.032, 0, 0);
  const wingGeo = new THREE.ShapeGeometry(wingShape, 16).rotateX(-Math.PI / 2);
  const fanGeo = new THREE.CircleGeometry(0.26, 30, -0.4, 1.8).rotateX(-Math.PI / 2);

  // leg instances: 4 flies x 6 legs x 4 segments, joints x 3
  const SEG_PER_LEG = 4, JOINT_PER_LEG = 3;
  const segIM = new THREE.InstancedMesh(G.cyl, mats.leg, FLY_COUNT * 6 * SEG_PER_LEG);
  const jointIM = new THREE.InstancedMesh(G.joint, mats.leg, FLY_COUNT * 6 * JOINT_PER_LEG);
  for (const im of [segIM, jointIM]) { im.instanceMatrix.setUsage(THREE.DynamicDrawUsage); im.frustumCulled = false; scene.add(im); }

  const shadowTex = canvasTex(64, 64, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(30,22,10,.55)'); gr.addColorStop(1, 'rgba(30,22,10,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  shadowTex.wrapS = shadowTex.wrapT = THREE.ClampToEdgeWrapping;
  const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
  const shadowGeo = new THREE.PlaneGeometry(0.56, 0.72).rotateX(-Math.PI / 2);

  const r = rng(404);
  const spots = [0.3, 1.85, 3.35, 4.8];
  const flies = [];
  for (let k = 0; k < FLY_COUNT; k++) {
    const ang = spots[k] + (r() - 0.5) * 0.35, rad = 0.66 + r() * 0.16;
    const root = new THREE.Group();
    root.position.set(Math.cos(ang) * rad, 0, Math.sin(ang) * rad);
    const body = new THREE.Group();
    body.position.y = BODY_H;
    root.add(body);

    const add = (geo, mat, sx, sy, sz, x, y, z, parent = body) => {
      const mesh = new THREE.Mesh(geo, mat);
      mesh.scale.set(sx, sy, sz); mesh.position.set(x, y, z);
      parent.add(mesh); return mesh;
    };
    add(G.sphere, mats.thorax, 0.078, 0.07, 0.1, 0, 0, 0);
    add(G.sphere, mats.thorax, 0.04, 0.03, 0.036, 0, 0.042, -0.074);
    const abdomen = add(G.abdomen, mats.abdomen, 0.074, 0.064, 0.125, 0, -0.012, -0.175);
    abdomen.rotation.x = -0.2;

    const headPivot = new THREE.Group();
    headPivot.position.set(0, 0.02, 0.086);
    headPivot.rotation.order = 'YXZ';
    body.add(headPivot);
    const headMat = mats.head.clone();
    headMat.emissive = new THREE.Color(0x6fdcff);
    headMat.emissiveIntensity = 0;   // raised only while this fly's line is on screen
    const head = add(G.sphere, headMat, 0.066, 0.06, 0.05, 0, 0, 0.042, headPivot);
    for (const s of [-1, 1]) {
      const eye = add(G.eye, mats.eye, 0.034, 0.05, 0.044, s * 0.05, 0.004, 0.046, headPivot);
      eye.rotation.y = s * 0.28;
      const ant = add(G.cone, mats.head, 0.006, 0.02, 0.006, s * 0.016, 0.034, 0.084, headPivot);
      ant.rotation.x = 0.7; ant.rotation.z = -s * 0.5;
    }
    const prob = add(G.cyl, mats.dark, 0.007, 0.03, 0.007, 0, -0.056, 0.036, headPivot);
    prob.rotation.x = -0.25;

    // wings: right side as built, left side mirrored by its parent group
    const wings = [], fans = [];
    for (const s of [1, -1]) {
      const side = new THREE.Group();
      side.scale.x = s;
      body.add(side);
      const pivot = new THREE.Group();
      pivot.position.set(0.028, 0.064, -0.02);
      pivot.rotation.order = 'YXZ';
      side.add(pivot);
      const wmat = makeWingMaterial(false);
      const wing = new THREE.Mesh(wingGeo, wmat);
      wing.renderOrder = 2;
      pivot.add(wing);
      const fmat = makeWingMaterial(true);
      const fan = new THREE.Mesh(fanGeo, fmat);
      fan.position.copy(pivot.position);
      fan.rotation.z = 0.3;
      fan.renderOrder = 3;
      fan.visible = false;
      side.add(fan);
      wings.push({ pivot, mat: wmat });
      fans.push({ mesh: fan, mat: fmat });
    }

    const shadow = new THREE.Mesh(shadowGeo, shadowMat);
    shadow.position.y = 0.003;
    shadow.position.z = -0.04;
    root.add(shadow);

    // legs: hip on the thorax underside, resting foot on the carpet (body space)
    const legs = [];
    const FEET = [[0.12, 0.17], [0.175, 0.0], [0.145, -0.18]];
    const HIPZ = [0.045, 0.0, -0.045];
    for (const s of [1, -1]) for (let li = 0; li < 3; li++) {
      legs.push({
        s,
        hip: new THREE.Vector3(s * 0.04, -0.045, HIPZ[li]),
        foot: new THREE.Vector3(s * (FEET[li][0] + (r() - 0.5) * 0.02), -BODY_H, FEET[li][1] + (r() - 0.5) * 0.02),
        L1: 0.088 + li * 0.006, L2: 0.098 + li * 0.008,
        step: 0, stepDur: 0.45,
      });
    }

    scene.add(root);
    const yaw0 = Math.atan2(-root.position.x, -root.position.z) + (r() - 0.5) * 0.4;
    root.rotation.y = yaw0;
    flies.push({
      k, root, body, headPivot, head, headMat, abdomen, wings, fans, legs, shadow,
      yaw: yaw0, restYaw: yaw0, lift: 0, blur: 0, speaking: false,
      label: '', tagEl: null, seed: r() * 100,
    });
  }
  return { flies, segIM, jointIM };
}

// two-bone leg with the knee bent upward and outward
const _v = { c: new THREE.Vector3(), a: new THREE.Vector3(), kn: new THREE.Vector3(), f: new THREE.Vector3(), d: new THREE.Vector3(),
  u: new THREE.Vector3(), out: new THREE.Vector3(), mid: new THREE.Vector3(), sc: new THREE.Vector3() };
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _Y = new THREE.Vector3(0, 1, 0);

  _v.d.subVectors(b, a);
  const len = Math.max(_v.d.length(), 1e-5);
  _v.d.divideScalar(len);
  _q.setFromUnitVectors(_Y, _v.d);
  _v.mid.addVectors(a, b).multiplyScalar(0.5);
  _m4.compose(_v.mid, _q, _v.sc.set(rad, len, rad));

function initRenderer() {
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: (window.devicePixelRatio || 1) < 1.5, powerPreference: 'high-performance' });
  } catch (e) {
    return null;
  }
  const maxPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(maxPR);
  const scene = new THREE.Scene();
  const fogColor = new THREE.Color(0x6f6538);
  scene.background = fogColor;
  scene.fog = new THREE.FogExp2(fogColor, 0.06);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.02, 60);

  const room = buildRoom(scene, Math.min(8, renderer.capabilities.getMaxAnisotropy()));
  const F = buildFlies(scene);

  // the speaker's glow: one sprite and one small light, moved to whoever speaks
  const glowTex = canvasTex(128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(235,252,255,.85)'); gr.addColorStop(0.25, 'rgba(200,244,255,.5)');
    gr.addColorStop(0.6, 'rgba(160,230,255,.14)'); gr.addColorStop(1, 'rgba(160,230,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  glowTex.wrapS = glowTex.wrapT = THREE.ClampToEdgeWrapping;
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x8ae6ff, depthWrite: false, transparent: true, opacity: 0 }));
  glow.renderOrder = 4;
  scene.add(glow);
  const glowLight = new THREE.PointLight(0x9fe8ff, 0, 1.2, 2);
  scene.add(glowLight);

  // letter tag over the speaking fly (HTML, positioned from the 3D head)
  const tagsEl = $('tags');
  for (const f of F.flies) {
    const el = document.createElement('div');
    el.className = 'tag f' + f.k;
    el.hidden = true;
    tagsEl.appendChild(el);
    f.tagEl = el;
  }

  R = {
    renderer, scene, camera, room, ...F, glow, glowLight, maxPR, pr: maxPR,
    w: 0, h: 0, frame: 0, flicker: [], nextFlicker: 2 + Math.random() * 4, dying: room.panels.findIndex(([x, z]) => x === -8 && z === -16),
    speaker: -1, glowK: 0.5, glowAmt: 0, lookBias: new THREE.Vector3(), ema: 16.7, slowSince: 0, fps: 60,
    tmp: new THREE.Vector3(), tmp2: new THREE.Vector3(),
  };
  const ro = new ResizeObserver(resize);
  ro.observe(stage);
  resize();
  renderer.setAnimationLoop(render);
  return R;
}

function resize() {
  if (!R) return;
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
  R.w = w; R.h = h;
  R.renderer.setSize(w, h, false);
  R.camera.aspect = w / h;
  R.camera.fov = w / h < 0.8 ? 70 : 60;
  R.camera.updateProjectionMatrix();
  // lens shift: keep the flies centred in the part of the room the subtitles do not cover
  const subs = document.querySelector('.subs');
  const covered = subs ? Math.max(0, h - subs.offsetTop) : 0;
  R.lensShift = clamp(covered / h, 0, 0.45);
  R.camera.projectionMatrix.elements[9] = -R.lensShift;
  R.camera.projectionMatrixInverse.copy(R.camera.projectionMatrix).invert();
}

let lastT = performance.now() / 1000;
function render(nowMs) {
  const t = nowMs / 1000;
  const dt = Math.min(0.1, Math.max(0.0005, t - lastT));
  lastT = t;
  R.frame++;

  // adaptive resolution: if frames stay slow for 3 s, step the pixel ratio down (never below 1)
  R.ema = R.ema * 0.95 + dt * 1000 * 0.05;
  R.fps = 1000 / R.ema;
  if (R.ema > 21 && R.pr > 1) {
    if (!R.slowSince) R.slowSince = t;
    if (t - R.slowSince > 3) { R.pr = Math.max(1, R.pr - 0.25); R.renderer.setPixelRatio(R.pr); resize(); R.slowSince = 0; }
  } else R.slowSince = 0;

  updateFlicker(t);
  updateFlies(t, dt);
  updateCamera(t, dt);
  R.renderer.render(R.scene, R.camera);
  updateTags();
}

function panelBrightness(i, t) {
  for (const f of R.flicker) if (f.i === i && t < f.until) {
    const n = Math.sin(Math.floor(t * 31 + f.seed) * 12.9898) * 43758.5453;
    return (n - Math.floor(n)) > 0.42 ? 1 : 0.12;
  }
  return 1;
}
const _col = new THREE.Color();
function updateFlicker(t) {
  const im = R.room.panelIM;
  const touched = new Set();
  if (!REDUCED) {
    if (t > R.nextFlicker) {
      // favour panels in and near the room, where the flicker is seen
      const near = R.room.panels.map((p, i) => [i, Math.hypot(p[0], p[1])]).filter(([, d]) => d < 14);
      const pick = near[Math.floor(Math.random() * near.length)][0];
      R.flicker.push({ i: pick, until: t + 0.25 + Math.random() * 1.2, seed: Math.random() * 100 });
      R.nextFlicker = t + 4 + Math.random() * 9;
    }
    // one tired panel down the corridor sputters on its own schedule
    if (R.dying >= 0 && Math.sin(t * 0.7) > 0.93 && !R.flicker.some((f) => f.i === R.dying && t < f.until)) {
      R.flicker.push({ i: R.dying, until: t + 0.6, seed: Math.random() * 100 });
    }
  }
  for (const f of R.flicker) touched.add(f.i);
  R.flicker = R.flicker.filter((f) => t < f.until + 0.1);
  for (const i of touched) {
    const b = REDUCED ? 1 : panelBrightness(i, t);
    im.setColorAt(i, _col.setScalar(b));
  }
  if (touched.size) im.instanceColor.needsUpdate = true;
  let dim = 1;
  for (const L of R.room.roomLights) {
    const b = REDUCED ? 1 : panelBrightness(L.panel, t);
    L.light.intensity = L.base * (0.25 + 0.75 * b);
    dim = Math.min(dim, b);
  }
  R.room.hemi.intensity = 2.3 * (0.85 + 0.15 * dim);
}

function updateFlies(t, dt) {
  const flies = R.flies;
  const sp = R.speaker;
  const center = R.tmp.set(0, 0, 0);
  for (const f of flies) {
    const speaking = f.k === sp;
    f.speaking = speaking;
    const pos = f.root.position;
    // body facing
    let target = f.restYaw;
    if (sp >= 0) {
      if (speaking) {
        center.set(0, 0, 0);
        for (const o of flies) if (o !== f) center.add(o.root.position);
        center.multiplyScalar(1 / (flies.length - 1));
        target = Math.atan2(center.x - pos.x, center.z - pos.z);
      } else {
        const sPos = flies[sp].root.position;
        const toS = Math.atan2(sPos.x - pos.x, sPos.z - pos.z);
        target = f.restYaw + wrapAngle(toS - f.restYaw) * 0.3;
      }
    }
    f.yaw = dampAngle(f.yaw, target, 1.6, dt);
    f.root.rotation.y = f.yaw;

    // head
    let hy = REDUCED ? 0 : Math.sin(t * 0.21 + f.seed) * 0.22;
    let hx = 0.05;
    if (sp >= 0 && !speaking) {
      const sPos = flies[sp].root.position;
      hy = clamp(wrapAngle(Math.atan2(sPos.x - pos.x, sPos.z - pos.z) - f.yaw), -0.95, 0.95);
      hx = 0;
    } else if (speaking) { hy = 0; hx = -0.16; }
    f.headPivot.rotation.y = damp(f.headPivot.rotation.y, hy, 4, dt);
    f.headPivot.rotation.x = damp(f.headPivot.rotation.x, hx, 4, dt);

    // lift and wing blur
    f.lift = damp(f.lift, speaking ? 0.045 : 0, speaking ? 3 : 2, dt);
    f.blur = damp(f.blur, speaking ? 1 : 0, speaking ? 5 : 3.5, dt);
    const bob = REDUCED ? 0 : Math.sin(t * 1.3 + f.seed) * 0.002 + (speaking ? Math.sin(t * 9) * 0.004 : 0);
    f.body.position.y = BODY_H + f.lift + bob;
    f.abdomen.scale.y = 0.064 * (1 + (REDUCED ? 0 : 0.025 * Math.sin(t * 1.8 + f.seed)));

    const b = f.blur;
    const phase = REDUCED ? 1.2 : (R.frame * 2.39996 + f.seed) % TAU;
    for (let w = 0; w < 2; w++) {
      const wp = f.wings[w].pivot;
      const flapYaw = 0.45 + 0.8 * Math.sin(phase);
      const flapRoll = 0.3 + 0.45 * Math.cos(phase * 2.0);
      wp.rotation.y = 1.28 + (flapYaw - 1.28) * b;
      wp.rotation.z = 0.08 + (flapRoll - 0.08) * b;
      f.wings[w].mat.uniforms.uOpacity.value = 1 - 0.72 * b;
      const fan = f.fans[w];
      fan.mat.uniforms.uOpacity.value = b;
      fan.mesh.visible = b > 0.02;
    }
    f.shadow.scale.setScalar(1 - f.lift * 3);

    // occasional small leg shuffle for idle flies
    if (!REDUCED && !speaking && Math.random() < dt * 0.35) {
      const leg = f.legs[Math.floor(Math.random() * 6)];
      if (leg.step <= 0) leg.step = 1e-4;
    }
  }

  // legs into instances
  let si = 0, ji = 0;
  for (const f of flies) {
    f.root.updateMatrixWorld(true);
    const mw = f.body.matrixWorld;
    const bodyY = f.body.position.y;
    for (const leg of f.legs) {
      if (leg.step > 0) { leg.step += dt / leg.stepDur; if (leg.step >= 1) leg.step = 0; }
      const stepUp = leg.step > 0 ? Math.sin(leg.step * Math.PI) * 0.028 : 0;
      // feet stay on the carpet unless the body is lifted, then they hang a little
      const c = _v.c.set(leg.hip.x + leg.s * 0.024, leg.hip.y - 0.008, leg.hip.z);
      const footY = -bodyY + f.lift * 0.55 + stepUp;
      const foot = _v.f.set(leg.foot.x * (1 - f.lift * 1.5), footY, leg.foot.z * (1 - f.lift * 1.2));
      const a = _v.a.set(foot.x - leg.s * 0.028, foot.y + 0.022, foot.z * 0.93);
      _v.d.subVectors(a, c);
      let d = _v.d.length();
      const maxD = leg.L1 + leg.L2 - 1e-3;
      if (d > maxD) { _v.d.multiplyScalar(maxD / d); a.copy(c).add(_v.d); d = maxD; }
      _v.d.divideScalar(Math.max(d, 1e-5));
      const along = (leg.L1 * leg.L1 - leg.L2 * leg.L2 + d * d) / (2 * d);
      const hgt = Math.sqrt(Math.max(0, leg.L1 * leg.L1 - along * along));
      _v.out.set(leg.s * 0.35, 1, 0);
      _v.u.copy(_v.out).addScaledVector(_v.d, -_v.out.dot(_v.d)).normalize();
      const knee = _v.kn.copy(c).addScaledVector(_v.d, along).addScaledVector(_v.u, hgt);
      const hipW = R.tmp2.copy(leg.hip).applyMatrix4(mw);
      c.applyMatrix4(mw); knee.applyMatrix4(mw); a.applyMatrix4(mw); foot.applyMatrix4(mw);
      setSeg(R.segIM, si++, hipW, c, 0.011);
      setSeg(R.segIM, si++, c, knee, 0.0095);
      setSeg(R.segIM, si++, knee, a, 0.0075);
      setSeg(R.segIM, si++, a, foot, 0.0052);
      setJoint(R.jointIM, ji++, c, 0.011);
      setJoint(R.jointIM, ji++, knee, 0.0098);
      setJoint(R.jointIM, ji++, a, 0.0075);
    }
  }
  R.segIM.instanceMatrix.needsUpdate = true;
  R.jointIM.instanceMatrix.needsUpdate = true;

  // glow on the speaker's head (decoration)
  const g = R.glow;
  const target = sp >= 0 ? 0.3 + 0.7 * R.glowK : 0;
  R.glowAmt = damp(R.glowAmt, target, 3, dt);
  if (R.glowAmt > 0.005 && sp >= 0) {
    const f = flies[sp];
    f.head.getWorldPosition(g.position);
    g.position.y += 0.07;
    R.glowLight.position.copy(g.position);
  }
  const pulse = REDUCED ? 1 : 0.62 + 0.38 * Math.sin(t * TAU * (0.55 + 0.6 * R.glowK));
  g.material.opacity = Math.min(1, R.glowAmt * pulse * 0.95);
  g.scale.setScalar(0.2 + 0.16 * R.glowAmt);
  g.visible = R.glowAmt > 0.005;
  R.glowLight.intensity = R.glowAmt * pulse * 0.25;
  for (const f of flies) f.headMat.emissiveIntensity = f.k === sp ? R.glowAmt * pulse * 0.55 : 0;
}

function updateCamera(t, dt) {
  const cam = R.camera;
  if (R.debugCam) return;
  const narrow = R.w / R.h < 0.8;
  const radius = (narrow ? 2.7 : 2.2);
  let ang, rad, y;
  if (REDUCED) { ang = 0.75; rad = radius; y = 0.62; }
  else {
    ang = 0.75 + t * 0.017 + Math.sin(t * 0.031) * 0.25;
    rad = radius + Math.sin(t * 0.047) * 0.22;
    y = 0.62 + Math.sin(t * 0.037) * 0.14;
  }
  cam.position.set(Math.cos(ang) * rad, y, Math.sin(ang) * rad);
  // look toward the circle, leaning a little toward whoever speaks
  const bias = R.tmp.set(0, 0, 0);
  if (!REDUCED && R.speaker >= 0) bias.copy(R.flies[R.speaker].root.position).multiplyScalar(0.35);
  R.lookBias.x = damp(R.lookBias.x, bias.x, 1.2, dt);
  R.lookBias.z = damp(R.lookBias.z, bias.z, 1.2, dt);
  cam.lookAt(R.lookBias.x, 0.3 + (REDUCED ? 0 : Math.sin(t * 0.05) * 0.03), R.lookBias.z);
}

function updateTags() {
  const v = R.tmp;
  const placed = [];
  for (const f of R.flies) {
    const el = f.tagEl;
    if (!f.label || !f.speaking) { if (!el.hidden) el.hidden = true; continue; }   // only the speaker's letter
    f.head.getWorldPosition(v);
    v.y += 0.12;
    v.project(R.camera);
    const visible = v.z < 1 && v.x > -1.1 && v.x < 1.1 && v.y > -1.1 && v.y < 1.1;
    if (el.hidden === visible) el.hidden = !visible;
    if (!visible) continue;
    let x = (v.x * 0.5 + 0.5) * R.w;
    const y = (-v.y * 0.5 + 0.5) * R.h;
    // keep tags from sitting on top of each other: nudge sideways, away from the neighbour
    const half = (el.offsetWidth || 50) / 2 + 3;
    for (let pass = 0; pass < 2; pass++) for (const [px, py, ph] of placed) {
      if (Math.abs(py - y) < 20 && Math.abs(px - x) < half + ph) x = px + Math.sign(x - px || 1) * (half + ph);
    }
    placed.push([x, y, half]);
    el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;
    if (el.textContent !== f.label) el.textContent = f.label;
  }
}

/* ========================================================================
   DATA: relay status, turns, stream
   ======================================================================== */
const S = {
  running: null, reachable: null, lastKey: null, seen: new Set(), history: [], recent: [],
  queue: [], cur: null, replay: null, es: null, sseErrors: 0, pollTimer: 0, pollFails: 0, statusFails: 0,
  labelMap: new Map(), mode: 'connecting', retryStream: 0,
  backfilling: false, backfillTimer: 0, lastBackfill: null,
};

function pickStr(o, keys) {
  for (const k of keys) if (typeof o[k] === 'string' && o[k].trim()) return o[k].trim();
  return '';
}
function parseTs(v) {
  if (typeof v === 'number' && isFinite(v)) return v < 1e12 ? v * 1000 : v;
  if (typeof v === 'string' && v) { const n = Number(v); if (isFinite(n) && v.trim() !== '') return n < 1e12 ? n * 1000 : n; const d = Date.parse(v); if (isFinite(d)) return d; }
  return null;
}
function norm(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const t = raw.turn && typeof raw.turn === 'object' ? raw.turn : raw;
  const text = pickStr(t, ['text', 'line', 'message', 'content', 'utterance']);
  if (!text || text.length > MAX_TEXT) return null;
  const label = pickStr(t, ['label', 'speaker', 'name', 'who', 'fly']).slice(0, 40) || 'fly';
  const idRaw = t.id ?? t.seq ?? t.turn_id ?? t.n ?? t.index ?? null;
  const id = idRaw === null || idRaw === undefined ? null : String(idRaw);
  const ts = parseTs(t.ts ?? t.time ?? t.t ?? t.timestamp ?? t.created_at ?? t.at);
  let flyIndex = null;
  for (const k of ['fly_index', 'speaker_index', 'flyIndex', 'fly']) {
    if (Number.isInteger(t[k]) && t[k] >= 0) { flyIndex = t[k] % FLY_COUNT; break; }
  }
  return {
    id, label, text, flyIndex, ts: ts ?? Date.now(),
    key: id !== null ? 'i:' + id : 't:' + (ts ?? '') + '|' + label + '|' + text.slice(0, 60),
  };
}
function extractTurns(j) {
  if (Array.isArray(j)) return j;
  if (j && Array.isArray(j.turns)) return j.turns;
  if (j && Array.isArray(j.items)) return j.items;
  return j ? [j] : [];
}
function sortTurns(list) {
  const numeric = list.every((t) => t.id !== null && /^-?\d+$/.test(t.id));
  return list.slice().sort((a, b) => numeric ? Number(a.id) - Number(b.id) : a.ts - b.ts);
}

async function getJSON(path) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const res = await fetch(RELAY + path, { signal: ctl.signal, cache: 'no-store', credentials: 'omit' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}

function isRunning(s) {
  if (!s || typeof s !== 'object') return null;
  if (typeof s.running === 'boolean') return s.running;   // what the relay sends
  if (typeof s.live === 'boolean') return s.live;
  const st = String(s.state ?? s.status ?? '').toLowerCase().trim();
  if (['running', 'live', 'on', 'up'].includes(st)) return true;
  if (['stopped', 'paused', 'idle', 'off', 'down', 'offline'].includes(st)) return false;
  return null;
}
function applyStatus(s) {
  S.reachable = true;
  const a = isRunning(s);
  if (a !== null) S.running = a;
}

/* ---- subtitles + speaker ---- */
const subs = $('subs'), recentEl = $('recent'), nowEl = $('now'), subSr = $('sub-sr');
function flyIndexFor(t) {
  let idx;
  if (t.flyIndex !== null) { idx = t.flyIndex; S.labelMap.set(t.label, idx); }
  else if (S.labelMap.has(t.label)) idx = S.labelMap.get(t.label);
  else { idx = S.labelMap.size % FLY_COUNT; S.labelMap.set(t.label, idx); }
  if (R) R.flies[idx].label = t.label;
  return idx;
}
function who(t) {
  const el = document.createElement('span');
  el.className = 'who f' + flyIndexFor(t);
  el.textContent = t.label;
  return el;
}
function renderSubs() {
  recentEl.replaceChildren(...S.recent.map((t) => {
    const d = document.createElement('div');
    d.append(who(t), document.createTextNode(t.text));
    return d;
  }));
  subs.hidden = !S.cur && !S.recent.length;
}
function pushRecent(t) {
  if (S.recent.includes(t)) return;
  S.recent.push(t);
  while (S.recent.length > RECENT) S.recent.shift();
}
// the current line moves up into the faint recent lines
function retire() {
  if (S.cur) pushRecent(S.cur.t);
  S.cur = null;
  nowEl.replaceChildren();
  if (R) R.speaker = -1;
}
function clearSubs() {
  S.cur = null;
  S.recent = [];
  if (R) R.speaker = -1;
  nowEl.replaceChildren();
  renderSubs();
}
function setNow(t, shown) {
  nowEl.replaceChildren(who(t), document.createTextNode(t.text.slice(0, shown)));
  if (shown < t.text.length) { const caret = document.createElement('span'); caret.className = 'caret'; nowEl.appendChild(caret); }
}
function startTurn(t, replay) {
  retire();
  const idx = flyIndexFor(t);
  S.cur = { t, idx, t0: performance.now(), shown: -1, doneAt: null, replay };
  subSr.textContent = t.label + ': ' + t.text;
  renderSubs();
  if (R) R.speaker = idx;
}
// a line said while this page was not listening: shown whole, not typed out
function showStatic(t) {
  retire();
  const now = performance.now();
  S.cur = { t, idx: flyIndexFor(t), t0: now - 1e7, shown: t.text.length, doneAt: now, replay: false };
  setNow(t, t.text.length);
  renderSubs();
}
function uiTick(now) {
  const c = S.cur;
  if (c) {
    const cps = S.queue.length > 2 ? 80 : 34;
    const n = Math.min(c.t.text.length, Math.floor(((now - c.t0) / 1000) * cps));
    if (n !== c.shown) { c.shown = n; setNow(c.t, n); }
    if (n >= c.t.text.length && c.doneAt === null) c.doneAt = now;
    if (c.doneAt !== null) {
      const since = now - c.doneAt;
      if (since > 1200 && R && R.speaker === c.idx) R.speaker = -1;
      if (c.replay) {
        if (since > 2800 + Math.min(3000, c.t.text.length * 18)) nextReplay();
      } else if (S.queue.length && since > (S.queue.length > 2 ? 500 : 1800)) {
        startTurn(S.queue.shift(), false);
      }
    }
  } else if (S.queue.length) {
    startTurn(S.queue.shift(), false);
  }
  requestAnimationFrame(uiTick);
}

/* ---- quiet replay of the most recent lines while the generator is stopped or the relay is unreachable ---- */
function startReplay(list) {
  stopReplay();
  clearSubs();
  if (!list.length) return;          // no lines: just the room
  S.replay = { list, i: -1, timer: 0 };
  nextReplay();
}
function nextReplay() {
  const rp = S.replay;
  if (!rp) return;
  rp.i++;
  if (rp.i >= rp.list.length) {
    clearSubs();
    rp.i = -1;
    rp.timer = setTimeout(nextReplay, 9000);
    return;
  }
  startTurn(rp.list[rp.i], true);
}
function stopReplay() {
  if (S.replay) clearTimeout(S.replay.timer);
  S.replay = null;
  if (S.cur && S.cur.replay) clearSubs();
}

/* ---- live: stream first, polling as the fallback ---- */
function receive(t, backfill) {
  if (S.seen.has(t.key)) return;
  S.seen.add(t.key);
  if (t.id !== null) S.lastKey = t.id;
  if (S.mode !== 'running') enterRunning(true);
  S.history.push(t);
  if (S.history.length > 400) S.history.splice(0, S.history.length - 300);
  if (backfill) {
    // said while this page was not listening: keep it as context, do not play it as if it were live
    if (S.cur && S.cur.doneAt !== null && !S.queue.length) retire();
    if (S.lastBackfill) pushRecent(S.lastBackfill);
    S.lastBackfill = t;
    renderSubs();
    return;
  }
  S.queue.push(t);
  while (S.queue.length > 10) pushRecent(S.queue.shift());   // far behind: skip the typing, keep the line
}
function handlePayload(raw, evName) {
  let j;
  try { j = JSON.parse(raw); } catch { return; }
  if (!j || typeof j !== 'object') return;
  if (evName === 'status' || j.type === 'status') {
    const was = S.running;
    applyStatus(j.status && typeof j.status === 'object' ? j.status : j);
    if (S.running !== was) decide();
    return;
  }
  if (evName === 'ping' || j.type === 'ping' || j.type === 'hello') return;
  for (const r of extractTurns(j)) { const t = norm(r); if (t) receive(t, S.backfilling); }
}
function endBackfill() {
  S.backfilling = false;
  clearTimeout(S.backfillTimer);
  const t = S.lastBackfill;
  S.lastBackfill = null;
  if (t && (!S.cur || S.cur.doneAt !== null) && !S.queue.length) showStatic(t);
  else if (t) { pushRecent(t); renderSubs(); }
}
function openStream() {
  if (S.es || typeof EventSource === 'undefined') { if (!S.es) startPolling(); return; }
  let es;
  // ?after= makes the relay replay what this page missed; on an automatic reconnect
  // the browser's Last-Event-ID takes over.
  const after = S.lastKey !== null && /^\d+$/.test(S.lastKey) ? '?after=' + S.lastKey : '';
  try { es = new EventSource(RELAY + '/stream' + after); } catch { startPolling(); return; }
  S.es = es;
  es.onopen = () => {
    S.sseErrors = 0; stopPolling();
    // everything before the relay's caught_up event is replayed backlog
    S.backfilling = true;
    clearTimeout(S.backfillTimer);
    S.backfillTimer = setTimeout(endBackfill, 5000);
  };
  es.onmessage = (e) => handlePayload(e.data, 'message');
  es.addEventListener('turn', (e) => handlePayload(e.data, 'turn'));
  es.addEventListener('status', (e) => handlePayload(e.data, 'status'));
  es.addEventListener('caught_up', () => endBackfill());
  es.onerror = () => {
    S.sseErrors++;
    if (es.readyState === 2 || S.sseErrors >= 3) {
      closeStream();
      if (S.mode === 'running' || S.mode === 'connecting') {
        startPolling();
        clearTimeout(S.retryStream);
        S.retryStream = setTimeout(() => { if (S.mode === 'running') openStream(); }, 60000);
      }
    }
  };
}
function closeStream() {
  if (S.es) { S.es.close(); S.es = null; }
  S.backfilling = false;
  S.lastBackfill = null;
  clearTimeout(S.backfillTimer);
}
function startPolling() {
  if (S.pollTimer) return;
  const tick = async () => {
    try {
      const path = '/turns' + (S.lastKey !== null ? '?after=' + encodeURIComponent(S.lastKey) : '');
      const list = sortTurns(extractTurns(await getJSON(path)).map(norm).filter(Boolean));
      // more than a few new lines at once is a gap being filled, not live speech
      list.forEach((t, i) => receive(t, i < list.length - 3));
      if (S.lastBackfill) endBackfill();
      S.pollFails = 0;
    } catch { S.pollFails++; }
    S.pollTimer = setTimeout(tick, S.pollFails > 2 ? 15000 : 5000);
  };
  S.pollTimer = setTimeout(tick, 5000);
}
function stopPolling() {
  clearTimeout(S.pollTimer);
  S.pollTimer = 0;
}

function enterRunning(fromTurn) {
  const wasStopped = S.mode !== 'running';
  S.running = true;
  if (S.replay) {
    stopReplay();
    // the latest recorded lines stay as context for the live ones
    for (const t of S.history.slice(-RECENT)) if (!S.queue.includes(t)) pushRecent(t);
    renderSubs();
  }
  S.mode = 'running';
  if (!fromTurn || wasStopped) openStream();
}
function enterStopped(kind) {
  closeStream();
  stopPolling();
  S.queue.length = 0;
  S.mode = kind;
  startReplay(S.history.slice(-40));
}
async function refreshHistory() {
  try {
    const list = sortTurns(extractTurns(await getJSON('/turns')).map(norm).filter(Boolean));
    for (const t of list) {
      if (!S.seen.has(t.key)) { S.seen.add(t.key); S.history.push(t); }
      if (t.id !== null) S.lastKey = t.id;
    }
    S.history = sortTurns(S.history);
    return true;
  } catch { return false; }
}
function decide() {
  if (S.running === false) { if (S.mode !== 'stopped') refreshHistory().then(() => enterStopped('stopped')); return; }
  if (S.running === true || S.reachable) { if (S.mode !== 'running') enterRunning(false); return; }
  if (S.mode !== 'unreachable') enterStopped('unreachable');
}
async function pollStatus() {
  try {
    const was = S.running;
    applyStatus(await getJSON('/status'));
    S.statusFails = 0;
    if (S.running !== was || S.mode === 'unreachable' || S.mode === 'connecting') decide();
  } catch {
    S.statusFails++;
    // polling only runs while the generator runs, so two failed status checks in a row also count
    if (!S.es && (S.pollFails > 2 || S.statusFails >= 2)) { S.reachable = false; if (S.mode !== 'unreachable') { S.running = null; enterStopped('unreachable'); } }
  }
}

async function boot() {
  const [st, tj] = await Promise.allSettled([getJSON('/status'), getJSON('/turns')]);
  if (tj.status === 'fulfilled') {
    const list = sortTurns(extractTurns(tj.value).map(norm).filter(Boolean));
    for (const t of list) { S.seen.add(t.key); S.history.push(t); if (t.id !== null) S.lastKey = t.id; }
  }
  if (st.status === 'fulfilled') applyStatus(st.value);
  else if (tj.status === 'fulfilled') S.reachable = true;

  if (st.status !== 'fulfilled' && tj.status !== 'fulfilled') {
    S.reachable = false;
    enterStopped('unreachable');
  } else if (S.running === false) {
    enterStopped('stopped');
  } else {
    const last = S.history[S.history.length - 1];
    for (const t of S.history.slice(-RECENT - 1, -1)) pushRecent(t);
    if (last) showStatic(last);
    enterRunning(false);
  }
  setInterval(pollStatus, 30000);
}

try { initRenderer(); } catch (e) { R = null; console.error(e); }
requestAnimationFrame(uiTick);
boot();

if (LOCAL) {
  window.__S = () => S;
  window.__backrooms = () => R ? ({
    fps: Math.round(R.fps * 10) / 10, pixelRatio: R.pr, mode: S.mode, history: S.history.length,
    queue: S.queue.length, speaker: R.speaker, recent: S.recent.length,
  }) : ({ mode: S.mode });
}
</script>
</body>
</html>
